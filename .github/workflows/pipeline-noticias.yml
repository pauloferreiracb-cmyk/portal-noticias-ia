name: Pipeline diÃ¡rio de notÃ­cias de IA

on:
  schedule:
    # 09:00 no horÃ¡rio de BrasÃ­lia (12:00 UTC)
    - cron: "0 12 * * *"
  workflow_dispatch: {} # permite rodar manualmente pelo botÃ£o "Run workflow" no GitHub

permissions:
  contents: write

jobs:
  gerar-conteudo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependÃªncias
        run: npm ci

      - name: Baixar fontes do carrossel (se ainda nÃ£o existirem)
        run: |
          mkdir -p scripts/fonts
          # Coloque manualmente Inter-Regular.ttf e Inter-Bold.ttf em scripts/fonts/
          # e comite no repo uma Ãºnica vez â€” o CI nÃ£o baixa fontes do Google Fonts.

      - name: Gerar artigo(s) novo(s)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run gerar-noticias

      - name: Gerar carrossel dos artigos novos
        env:
          SITE_DOMINIO: ${{ vars.SITE_DOMINIO }}
        run: npm run gerar-carrossel

      - name: Gerar capas com IA (Cloudflare Workers AI / FLUX, com fallback Unsplash)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: npm run gerar-capas-ia

      - name: Commitar e subir artigos + carrossel + capas de IA + fila social
        run: |
          git config user.name "portal-ia-bot"
          git config user.email "bot@portal-ia.local"
          git add src/content/noticias public/carrossel public/capas-ia content/fila-social.json
          git diff --cached --quiet || git commit -m "auto: novas notÃ­cias de IA $(date +%F)"
          git push

      - name: Disponibilizar carrossel pra download (backup manual)
        uses: actions/upload-artifact@v4
        with:
          name: carrossel-${{ github.run_id }}
          path: public/carrossel/
          retention-days: 7




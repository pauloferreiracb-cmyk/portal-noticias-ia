name: Gerar rascunhos de notícias

on:
  schedule:
    # 7h, 11h, 14h, 16h, 18h e 20h no horário de Brasília (UTC-3). O GitHub Actions
    # costuma atrasar cron em alguns minutos (até ~30 min em horários de pico).
    - cron: "0 10,14,17,19,21,23 * * *"
  workflow_dispatch: # permite disparar manualmente pela aba Actions do GitHub
    inputs:
      max_items:
        description: "Máximo de publicações + rascunhos nesta execução"
        default: "4"

# contents: commita notícias/capas direto no repo; issues: cria rascunhos
permissions:
  contents: write
  issues: write

# Execuções entram na mesma fila: nunca rodam juntas
# (evita sobrescrita de data/published-sources.json).
concurrency:
  group: noticias-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Estado do limite de 1 alerta de falha a cada 6h
      - name: Restaurar estado dos alertas
        uses: actions/cache/restore@v4
        with:
          path: .alert-state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Buscar fontes e criar rascunhos
        run: npx tsx scripts/generate-news.ts
        env:
          # agendado = 1 notícia por execução (6 por dia); manual = valor informado (padrão 4)
          MAX_ITEMS_PER_RUN: ${{ github.event_name == 'schedule' && '1' || inputs.max_items || '4' }}
          # chave geral: só publica direto se a variável do repo AUTOPUBLICAR_LIGADO for "true"
          AUTOPUBLICAR_LIGADO: ${{ vars.AUTOPUBLICAR_LIGADO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USE_GEMINI_IMAGES: ${{ vars.USE_GEMINI_IMAGES }} # "true" liga capas via Gemini (fallback Unsplash)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # token automático do Actions, só precisa habilitar permissão de "issues: write"

      - name: Salvar estado dos alertas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alert-state
          key: alert-state-${{ github.run_id }}
